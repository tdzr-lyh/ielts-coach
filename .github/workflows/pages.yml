# 仅供独立 ielts-coach 仓库：复制为该仓库 .github/workflows/pages.yml。
# 此文件留在 deployment/ 时不会在当前旧站仓库触发部署。
name: Deploy IELTS coach to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout standalone repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test learning model and cloud synchronization
        run: node --test

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build standalone site
        env:
          IELTS_COACH_SUPABASE_URL: ${{ vars.IELTS_COACH_SUPABASE_URL || secrets.IELTS_COACH_SUPABASE_URL }}
          IELTS_COACH_SUPABASE_ANON_KEY: ${{ vars.IELTS_COACH_SUPABASE_ANON_KEY || secrets.IELTS_COACH_SUPABASE_ANON_KEY }}
        run: python build_deploy.py

      - name: Upload standalone site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
